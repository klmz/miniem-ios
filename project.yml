# The Xcode project is generated from this file (brew install xcodegen; xcodegen generate),
# so there is no .xcodeproj in git to merge-conflict over.
name: Miniem
options:
  bundleIdPrefix: nl.klmz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
targets:
  Miniem:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: GoogleService-Info.plist
        optional: true
        buildPhase: resources
    dependencies:
      - target: MiniemWidget
      - package: Firebase
        product: FirebaseMessaging
    entitlements:
      path: App/Miniem.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.nl.klmz.miniem]
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Miniem
        UILaunchScreen: {}
        # Only standard HTTPS: exempt, so TestFlight builds do not wait on a compliance answer.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
        FirebaseAppDelegateProxyEnabled: false
        CFBundleURLTypes:
          - CFBundleURLSchemes: [miniem]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.klmz.miniem
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  MiniemWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    entitlements:
      path: Widget/MiniemWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.nl.klmz.miniem]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Miniem
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.klmz.miniem.widget
  MiniemTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Miniem
schemes:
  Miniem:
    build:
      targets:
        Miniem: all
    test:
      targets: [MiniemTests]
