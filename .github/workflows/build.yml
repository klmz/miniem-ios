name: Build

# Modelled on klmz/m4b-player's iOS job: same Xcode selection, same secret names (so its
# scripts/upload-github-secrets.sh works here with --repo klmz/miniem-ios), same team.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  # Every TestFlight build needs a higher build number than the last one.
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 on this runner image. Available:" $(ls -d /Applications/Xcode*.app)
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Unit tests
        run: |
          # Runner images change their simulators; take whichever iPhone is there.
          DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d.values() for x in r if x['name'].startswith('iPhone')))")
          mkdir -p build
          set -o pipefail
          # xcpretty keeps the log readable but drops error details, so the raw log is kept
          # and its errors printed when the build fails.
          xcodebuild test -project Miniem.xcodeproj -scheme Miniem \
            -destination "id=$DEVICE" CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/test.log | xcpretty \
            || { grep -E "error:|failed|Error Domain" build/test.log | head -60; exit 1; }

  testflight:
    name: Distribute to TestFlight
    needs: test
    # Only main reaches a phone, and the signing key never meets a pull request.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    env:
      TEAM_ID: "9YUWU76L6V"
    steps:
      - uses: actions/checkout@v5

      - name: Check configuration
        id: config
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          CERT_P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
        run: |
          missing=""
          [ -z "$ASC_KEY" ] && missing="$missing APP_STORE_CONNECT_KEY_BASE64"
          [ -z "$ASC_KEY_ID" ] && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$CERT_P12" ] && missing="$missing IOS_CERTIFICATE_P12_BASE64"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing distributed; missing secret(s):$missing"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode 26
        if: steps.config.outputs.configured == 'true'
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 on this runner image. Available:" $(ls -d /Applications/Xcode*.app)
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Restore GoogleService-Info.plist
        # Optional, and not a secret: committing it to the repository root works too.
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$PLIST" ] && [ ! -f GoogleService-Info.plist ]; then
            printf '%s' "$PLIST" > GoogleService-Info.plist
          fi

      - name: Set up the App Store Connect key
        if: steps.config.outputs.configured == 'true'
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY" | base64 -d > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Check the App Store Connect key
        # Prints only shapes and Apple's answer, never the values. "Authentication failed"
        # from xcodebuild says nothing about which part is wrong; this does.
        if: steps.config.outputs.configured == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          python3 ci/check_asc_key.py "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Set up the signing keychain
        # The team's distribution certificate, the same one m4b-player uses: one
        # certificate signs every app in the team. Xcode's cloud signing refuses the key.
        if: steps.config.outputs.configured == 'true'
        env:
          CERT_P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Distribution/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::IOS_CERTIFICATE_P12_BASE64 holds no distribution certificate."
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          # The serial, to find the same certificate through the API.
          SERIAL=$(openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:CERT_PASSWORD -nokeys -legacy 2>/dev/null \
            | openssl x509 -noout -serial 2>/dev/null | cut -d= -f2)
          if [ -z "$SERIAL" ]; then
            SERIAL=$(openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:CERT_PASSWORD -nokeys \
              | openssl x509 -noout -serial | cut -d= -f2)
          fi
          echo "CERT_SERIAL=$SERIAL" >> "$GITHUB_ENV"

      - name: Create the provisioning profiles
        if: steps.config.outputs.configured == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          python3 ci/make_profiles.py "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "$CERT_SERIAL" "$RUNNER_TEMP/profiles.plist"

      - name: Generate the Xcode project
        if: steps.config.outputs.configured == 'true'
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive
        # Archived with an ad-hoc signature: no certificate or profile needed, and the
        # entitlements (App Group, push) are still embedded. Letting xcodebuild sign here
        # makes it create a development certificate and profile through the API, which
        # fails with "Authentication failed" even with a valid key — m4b-player avoids the
        # same trap by archiving unsigned. The real signing happens at export, below.
        if: steps.config.outputs.configured == 'true'
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild archive -project Miniem.xcodeproj -scheme Miniem -configuration Release \
            -destination generic/platform=iOS -archivePath build/Miniem.xcarchive \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO PROVISIONING_PROFILE_SPECIFIER= DEVELOPMENT_TEAM="$TEAM_ID" \
            2>&1 | tee build/archive.log | xcpretty \
            || { grep -E "error:|Error Domain|No profiles|provisioning|signing|certificate" build/archive.log | sort -u | head -60; exit 1; }

      - name: Show the archived entitlements
        if: steps.config.outputs.configured == 'true'
        run: |
          for bundle in build/Miniem.xcarchive/Products/Applications/Miniem.app \
                        build/Miniem.xcarchive/Products/Applications/Miniem.app/PlugIns/MiniemWidget.appex; do
            echo "== $bundle"
            codesign -d --entitlements - --xml "$bundle" 2>/dev/null | plutil -p - || echo "(no entitlements)"
          done

      - name: Upload the archive as an artifact
        if: steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: miniem-ios-xcarchive
          path: build/Miniem.xcarchive
          if-no-files-found: error

      - name: Keep the build log
        if: failure() && steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: archive-log
          path: build/*.log

      - name: Upload to TestFlight
        if: steps.config.outputs.configured == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          OPTIONS=ci/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$OPTIONS"
          /usr/libexec/PlistBuddy -c "Set :signingStyle manual" "$OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string $SIGNING_IDENTITY" "$OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$OPTIONS"
          /usr/libexec/PlistBuddy -c "Merge $RUNNER_TEMP/profiles.plist :provisioningProfiles" "$OPTIONS"
          plutil -p "$OPTIONS"
          xcodebuild -exportArchive -archivePath build/Miniem.xcarchive \
            -exportOptionsPlist "$OPTIONS" -exportPath "$RUNNER_TEMP/upload"
          IPA=$(find "$RUNNER_TEMP/upload" -name '*.ipa' | head -1)
          echo "Uploading $IPA"
          # altool finds the key in ~/.appstoreconnect/private_keys by its ID.
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove the key from disk
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP"/*.p12
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"/*.mobileprovision \
            "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision
